version: '3.8'

services:
  db:
    image: postgres:15
    container_name: simagrow_odoo_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - simagrow-odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    container_name: simagrow_odoo_app
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

volumes:
  simagrow-odoo-db-data:

