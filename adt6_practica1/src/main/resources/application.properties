# Configuración para el acceso a la Base de Datos
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Datos de conexión con la base de datos MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/simagrow
spring.datasource.username=root
spring.datasource.password=

# A�adir datos de prueba
# (Descomentar y volver a comentar porque en cada modificación de cualquier
# (archivo, volvería hacer los inserts por la librería DevTools)

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

