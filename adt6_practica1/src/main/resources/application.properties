# Configuracion para el acceso a la Base de Datos
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Datos de conexion con la base de datos MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/simagrow?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Dialecto específico (Usa este para MySQL 8 o superior, que es lo normal en 2026)

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

